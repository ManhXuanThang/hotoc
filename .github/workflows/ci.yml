name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  # ============================================================
  # JOB 1: Lint + Typecheck (chạy mọi PR và push)
  # ============================================================
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  # ============================================================
  # JOB 2: Test (chạy mọi PR và push)
  # ============================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: gia_pha_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma migrations (test DB)
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/gia_pha_test

      - name: Run tests
        run: npm run test
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/gia_pha_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test_secret_access
          JWT_REFRESH_SECRET: test_secret_refresh
          NODE_ENV: test

  # ============================================================
  # JOB 3: Deploy Staging (chỉ khi merge vào main)
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [quality, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Deploy Frontend lên Vercel
      - name: Deploy Frontend (Vercel)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: apps/web
          vercel-args: '--prod'

      # Deploy Backend lên Railway
      - name: Deploy Backend (Railway)
        uses: bervProject/railway-deploy@main
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: api

      - name: Notify Deployment
        if: success()
        run: |
          echo "✅ Deployed to staging successfully"
          echo "Frontend: https://staging.${{ secrets.APP_DOMAIN }}"
          echo "Backend: https://api-staging.${{ secrets.APP_DOMAIN }}"
